server.port=8081

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# disable Config Server for tests
spring.cloud.config.enabled=false

# disable RabbitMQ autoconfiguration for tests
spring.boot.autoconfigure.amqp.RabbitAutoConfiguration.enabled=false

# disable Eureka
spring.cloud.service-registry.auto-registration.enabled=false
eureka.client.enabled=false

#JWT-PROPERTIES for tests (секрет — base64, >= 256 бит, как требует HS256; только для тестов)
jwt.secret.key=YWdvcmEtdGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LW5vdC1mb3ItcHJvZHVjdGlvbiEh
access.life.time=300000
refresh.life.time=432000000

# Minio, RabbitMQ STOMP relay — значения-заглушки, внешние сервисы в тестах не поднимаются
minio.url=http://localhost:9000
minio.access-key=test
minio.secret-key=test-secret
minio.bucket-name=agora-test
rabbitmq.queue.api-likes=api.like.created.queue
rabbitmq.stomp.host=localhost
rabbitmq.stomp.port=61613

# Kafka-брокера в тестах нет: не пытаться создавать топики (NewTopic-бины)
spring.kafka.admin.auto-create=false
