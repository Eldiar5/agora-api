server.port=8081

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# disable Config Server for tests
spring.cloud.config.enabled=false

# disable RabbitMQ autoconfiguration for tests
spring.boot.autoconfigure.amqp.RabbitAutoConfiguration.enabled=false

# disable Eureka
spring.cloud.service-registry.auto-registration.enabled=false
eureka.client.enabled=false

#JWT-PROPERTIES for tests
jwt.secret.key=test-secret-key-for-jwt-handler-which-is-long-enough
token.life.time=300000